name: Native platform builds and tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-24.04
          - ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.12.0 <23'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Install dependencies and build the frontend from a clean checkout
        run: ./scripts/setup.sh --dev
      - name: Test backend
        working-directory: backend
        run: .venv/bin/python -m pytest -q
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Verify foreground startup, static UI, and graceful shutdown
        timeout-minutes: 3
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import signal
          import socket
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.request

          root = Path.cwd()
          with tempfile.TemporaryDirectory(prefix="director-studio-ci-") as temporary:
              data_dir = Path(temporary) / "data"
              log_path = Path(temporary) / "server.log"
              with socket.socket() as port_socket:
                  port_socket.bind(("127.0.0.1", 0))
                  port = port_socket.getsockname()[1]
              env = dict(os.environ, DS_HOST="127.0.0.1", DS_PORT=str(port),
                         DS_DATA_DIR=str(data_dir), DS_RELOAD="false")
              base_url = f"http://127.0.0.1:{port}"
              with log_path.open("w") as log:
                  server = subprocess.Popen([str(root / "start.sh")], cwd=temporary,
                                            env=env, stdout=log, stderr=subprocess.STDOUT)
                  try:
                      deadline = time.monotonic() + 40
                      while True:
                          if server.poll() is not None:
                              raise RuntimeError(f"Server exited during startup: {server.returncode}")
                          try:
                              with urllib.request.urlopen(base_url + "/api/health/live", timeout=2) as response:
                                  assert response.status == 200
                                  assert json.load(response) == {"ok": True}
                              break
                          except urllib.error.HTTPError:
                              raise
                          except urllib.error.URLError as error:
                              if time.monotonic() >= deadline:
                                  raise RuntimeError(f"Server did not become live within 40 seconds: {error.reason}") from error
                              time.sleep(0.25)
                      with urllib.request.urlopen(base_url + "/", timeout=5) as response:
                          assert response.status == 200
                          assert "text/html" in response.headers["Content-Type"]
                          assert 'id="root"' in response.read().decode()
                      assert (data_dir / "jobs").is_dir(), "DS_DATA_DIR was not used"
                      server.send_signal(signal.SIGTERM)
                      returncode = server.wait(timeout=15)
                      assert returncode in (0, -signal.SIGTERM), returncode
                      assert "Application shutdown complete." in log_path.read_text()
                      print("Foreground startup, isolated data, static UI, and graceful SIGTERM passed.")
                  except BaseException:
                      print(log_path.read_text())
                      raise
                  finally:
                      if server.poll() is None:
                          server.terminate()
                          try:
                              server.wait(timeout=5)
                          except subprocess.TimeoutExpired:
                              server.kill()
                              server.wait(timeout=5)
          PY
